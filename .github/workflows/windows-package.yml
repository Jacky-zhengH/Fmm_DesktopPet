name: Windows test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/build.txt
      - run: python -m pip install -r requirements/tools.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/release/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: fmm-windows-${{ github.sha }}
          path: |
            dist/Fmm-DesktopPet-v*.exe
            dist/Fmm-DesktopPet-v*.zip
            dist/Fmm-DesktopPet-v*-SHA256SUMS.txt
            dist/Fmm-DesktopPet-v*-Guide.txt
            build/release-notes.md
          if-no-files-found: error
          retention-days: 7
